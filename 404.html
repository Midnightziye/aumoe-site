<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在 · aumoe</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0d12'/><text x='50' y='70' font-size='56' font-family='system-ui,sans-serif' font-weight='600' fill='%237ee787' text-anchor='middle'>a</text></svg>">
<style>
  :root {
    --bg: #0b0d12;
    --bg-soft: #12151d;
    --line: #232833;
    --text: #e6e8ee;
    --muted: #8b93a5;
    --accent: #7ee787;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 15% -10%, rgba(126, 231, 135, .12), transparent 60%),
      radial-gradient(50rem 35rem at 100% 0%, rgba(88, 166, 255, .10), transparent 55%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: rgba(18, 21, 29, .72);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 44px 36px;
    backdrop-filter: blur(8px);
    text-align: center;
  }

  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(72px, 22vw, 112px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
    color: var(--accent);
    margin: 0 0 8px;
    opacity: .92;
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(20px, 4.5vw, 24px);
    font-weight: 600;
    letter-spacing: -.01em;
  }

  p {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 14.5px;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg-soft);
    transition: border-color .18s ease, color .18s ease, transform .18s ease;
  }

  .back:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .back svg {
    width: 15px;
    height: 15px;
    flex: none;
    opacity: .85;
  }

  footer {
    margin-top: 30px;
    font-size: 12px;
    color: var(--muted);
  }

  footer code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: #6f7789;
  }

  @media (max-width: 480px) {
    .card { padding: 34px 20px; border-radius: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .back:hover { transform: none; }
  }
</style>
</head>
<body>

  <main class="card">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者地址输错了。</p>

    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"></path>
        <path d="m12 19-7-7 7-7"></path>
      </svg>
      返回首页
    </a>

    <footer><code>aumoe.cn</code></footer>
  </main>

</body>
</html>
