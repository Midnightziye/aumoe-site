<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aumoe</title>
<meta name="description" content="aumoe 的个人主页">
<meta name="theme-color" content="#0b0d12">
<link rel="canonical" href="https://aumoe.cn/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aumoe.cn/">
<meta property="og:title" content="aumoe">
<meta property="og:description" content="aumoe 的个人主页">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0d12'/><text x='50' y='70' font-size='56' font-family='system-ui,sans-serif' font-weight='600' fill='%237ee787' text-anchor='middle'>a</text></svg>">
<style>
  :root {
    --bg: #0b0d12;
    --bg-soft: #12151d;
    --line: #232833;
    --text: #e6e8ee;
    --muted: #8b93a5;
    --accent: #7ee787;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(60rem 40rem at 15% -10%, rgba(126, 231, 135, .12), transparent 60%),
      radial-gradient(50rem 35rem at 100% 0%, rgba(88, 166, 255, .10), transparent 55%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 24px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: rgba(18, 21, 29, .72);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 36px;
    backdrop-filter: blur(8px);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 11px;
    margin-bottom: 26px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(126, 231, 135, .15);
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(34px, 8vw, 46px);
    font-weight: 650;
    letter-spacing: -.02em;
    line-height: 1.15;
  }

  h1 span { color: var(--accent); }

  .tagline {
    margin: 0 0 30px;
    color: var(--muted);
    font-size: 15px;
  }

  .rule {
    height: 1px;
    background: var(--line);
    margin: 0 0 26px;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    padding: 9px 15px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg-soft);
    transition: border-color .18s ease, transform .18s ease, color .18s ease;
  }

  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .links svg {
    width: 15px;
    height: 15px;
    flex: none;
    opacity: .85;
  }

  footer {
    margin-top: 34px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    align-items: center;
    justify-content: space-between;
  }

  footer code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: #6f7789;
  }

  @media (max-width: 480px) {
    .card { padding: 30px 22px; border-radius: 14px; }
    footer { justify-content: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .links a:hover { transform: none; }
  }
</style>
</head>
<body>

  <main class="card">
    <div class="badge"><span class="dot"></span>站点已上线</div>

    <h1>aumoe<span>.</span></h1>
    <p class="tagline">个人主页 · 施工中</p>

    <div class="rule"></div>

    <nav class="links" aria-label="联系方式">
      <a href="mailto:hi@aumoe.cn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m2 7 10 6 10-6"></path>
        </svg>
        hi@aumoe.cn
      </a>
    </nav>

    <footer>
      <span>© <span id="year">2026</span> aumoe</span>
      <code>Powered by Cloudflare Pages</code>
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
